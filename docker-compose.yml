services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: privstack-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - privstack_net

  privstack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privstack
    restart: unless-stopped
    ports:
      - "8082:3000"
    environment:
      - TZ=Europe/Budapest
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme_32char_random_string}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://192.168.0.131:8082}
      - DATABASE_PATH=/data/privstack.db
      - DOCKER_HOST=http://docker-socket-proxy:2375
      - NODE_ENV=production
    volumes:
      - privstack_data:/data
    networks:
      - privstack_net
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  privstack_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  privstack_data:
    driver: local
