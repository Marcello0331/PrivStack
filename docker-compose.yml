services:
  privstack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privstack
    restart: unless-stopped
    ports:
      - "8082:3000"
    environment:
      - TZ=Europe/Budapest
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme_32char_random_string}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://192.168.0.131:8082}
      - DATABASE_PATH=/data/privstack.db
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - NODE_ENV=production
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - privstack_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - privstack_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  privstack_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  privstack_data:
    driver: local
